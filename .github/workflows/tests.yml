name: tests

on:
  push:
    branches:
      - main
      - 'fase-*'
  pull_request:
    branches:
      - main
      - 'fase-*'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id "tests" is a required status check on main: do not rename it.
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      mysql:
        # Same major/minor as production; pinned by tag and digest.
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          # Throwaway container, reachable only from this runner. Root is used
          # once, to run users.sql; the app never connects as root.
          MYSQL_ROOT_PASSWORD: ci-root-ephemeral
          MYSQL_DATABASE: inmobiliaria_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: inmobiliaria_test
      DB_USERNAME: inmobiliaria_app
      DB_OWNER_USERNAME: inmobiliaria_owner
      # DB_PASSWORD and DB_OWNER_PASSWORD are generated per run (see below).

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # Same version as production.
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Create database users
        env:
          MYSQL_PWD: ci-root-ephemeral
        run: |
          OWNER_PW=$(openssl rand -hex 24)
          APP_PW=$(openssl rand -hex 24)
          echo "::add-mask::$OWNER_PW"
          echo "::add-mask::$APP_PW"
          { printf "SET @owner_password='%s', @app_password='%s', @user_host='%%';\n" "$OWNER_PW" "$APP_PW"; cat database/sql/users.sql; } \
            | mysql --no-defaults -h 127.0.0.1 -P 3306 -u root
          echo "DB_PASSWORD=$APP_PW" >> "$GITHUB_ENV"
          echo "DB_OWNER_PASSWORD=$OWNER_PW" >> "$GITHUB_ENV"

      - name: Run migrations (owner)
        run: php artisan migrate --database=mysql_owner --force

      - name: Run tests (app user)
        env:
          DB_OWNER_PASSWORD: ''
        run: php artisan test
